<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mazmorra</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
body{display:flex;justify-content:center;min-height:100dvh}
.app{width:100%;max-width:440px;background:var(--stone);padding:14px;
display:flex;flex-direction:column;min-height:100dvh}
h1{font-family:var(--serif);font-size:18px;font-weight:600;margin:0 0 3px}
p.sub{color:var(--dim);font-size:13px;margin:0 0 16px;line-height:1.4}
input{width:100%;padding:14px;margin-bottom:9px;background:var(--stone2);
border:1px solid var(--line);border-radius:4px;color:var(--parchment);
font-family:var(--serif);font-size:17px}
input#code{letter-spacing:.22em;text-transform:uppercase;text-align:center}
.big{width:100%;padding:15px;background:var(--brass);color:#1A1408;border:0;
border-radius:4px;font-size:16px;font-weight:600}
.big[disabled]{opacity:.4}
.err{color:#E08C7A;font-size:13px;min-height:18px;margin:8px 0 0}
.heroes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero{padding:16px 8px;background:var(--stone2);border:1px solid var(--line);
border-radius:4px;color:var(--parchment);font-size:15px;font-weight:600}
.hero small{display:block;color:var(--dim);font-weight:400;font-size:11px;
margin-top:3px;font-family:var(--sans)}
.hero[disabled]{opacity:.3}
.colores{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.color{width:42px;height:42px;padding:0;border-radius:6px;border:2px solid var(--line);cursor:pointer}
.color.mine{border-color:var(--parchment);box-shadow:0 0 0 2px var(--parchment) inset}
.color[disabled]{opacity:.25;cursor:default}
.misheroes{margin:4px 0 16px}
.miheroe{display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.miheroe b{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
background:#2E3742;border:1px solid var(--brass);color:var(--brass);font-family:var(--serif);font-size:13px}
.miheroe button{margin-left:auto;padding:6px 10px;background:transparent;border:1px solid var(--line);
border-radius:4px;color:var(--dim);font-size:12px}
.board{width:100%;aspect-ratio:12/9;margin-bottom:12px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs.hide{display:none}
.tab{padding:8px 12px;background:var(--stone2);border:1px solid var(--line);border-radius:4px;
color:var(--parchment);font-size:13px;white-space:nowrap;flex-shrink:0}
.tab[aria-pressed="true"]{border-color:var(--brass);background:#282F38}
.who{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.barras{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.barra{flex:1;height:8px;background:var(--stone2);border-radius:4px;overflow:hidden}
.relleno{height:100%;border-radius:4px;transition:width .2s ease}
.relleno.vida{background:var(--moss)}
.relleno.fatiga{background:var(--teal)}
.acciones{display:flex;gap:4px;flex-shrink:0}
.punto{width:10px;height:10px;border-radius:50%;border:2px solid var(--brass);display:block}
.punto.lleno{background:var(--brass)}
.who b{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;
justify-content:center;background:#2E3742;border:2px solid var(--brass);
color:var(--brass);font-family:var(--serif)}
.who span{font-family:var(--serif);font-size:15px}
.who i{margin-left:auto;color:var(--dim);font-size:11.5px;font-style:normal}
.hint{color:var(--dim);font-size:12.5px;min-height:17px;margin:0 0 8px;line-height:1.35}
.verb{width:100%;padding:17px;background:var(--stone2);border:1px solid var(--line);
border-radius:4px;color:var(--parchment);font-size:16px;font-weight:600}
.verb[aria-pressed="true"]{background:var(--brass);color:#1A1408;border-color:var(--brass)}
.verb[disabled]{opacity:.35}
.verbos{display:flex;gap:8px}
.verbos .verb{width:auto;flex:1}
.row{display:flex;gap:8px;margin-top:8px}
.row button{flex:1;padding:15px;border-radius:4px;font-size:15px;font-weight:600;
border:1px solid var(--line)}
.go{background:var(--brass);color:#1A1408;border-color:var(--brass)}
.back{background:transparent;color:var(--dim)}
.secundario{width:100%;padding:13px;margin-top:8px;background:transparent;
border:1px solid var(--line);border-radius:4px;color:var(--parchment);font-size:14px;font-weight:600}
.secundario[disabled]{opacity:.35}
.secundario.hide{display:none}
.tok.foe.enalcance{box-shadow:0 0 0 2px var(--brass) inset}
.tok.foe.sel{background:var(--brass);border-color:var(--brass);color:#1A1408}
.modal{position:fixed;inset:0;background:rgba(13,17,22,.92);display:flex;
align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.hide{display:none}
.modalCaja{width:100%;max-width:380px;text-align:center}
.modalCaja h1{font-size:22px;margin:0 0 10px}
.modalCaja p{color:var(--dim);font-size:14px;margin:0 0 20px;line-height:1.4}
.grande{width:100%;padding:22px;margin-bottom:10px;background:var(--stone2);
border:1px solid var(--line);border-radius:6px;color:var(--parchment);font-size:17px;font-weight:600}
.hide{display:none}
</style></head><body>
<div class="app">
  <div id="s1">
    <h1>Entrar en la partida</h1>
    <p class="sub">Escribe el código que sale en la tele.</p>
    <input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off">
    <input id="name" maxlength="14" placeholder="Tu nombre" autocomplete="off">
    <button class="big" id="enter">Entrar</button>
    <p class="err" id="e1"></p>
  </div>

  <div id="s2" class="hide">
    <h1>Elige tu color y tus héroes</h1>
    <p class="sub">Puedes llevar más de un héroe. Nadie repite color ni clase.</p>
    <div class="colores" id="colores"></div>
    <div class="heroes" id="heroes"></div>
    <div class="misheroes" id="misheroes"></div>
    <p class="err" id="e2"></p>
    <button class="big" id="listo">Listo, a jugar</button>
  </div>

  <div id="s3" class="hide">
    <div class="tabs hide" id="tabs"></div>
    <div class="who"><b id="ltr"></b><span id="nm"></span><i id="conn"></i></div>
    <div class="barras">
      <div class="barra"><div class="relleno vida" id="barraVida"></div></div>
      <div class="barra"><div class="relleno fatiga" id="barraFatiga"></div></div>
      <div class="acciones" id="acciones"></div>
    </div>
    <div class="board" id="b"></div>
    <p class="hint" id="hint"></p>
    <div class="verbos">
      <button class="verb" id="mv">Mover</button>
      <button class="verb" id="at">Atacar</button>
    </div>
    <div class="row hide" id="cf">
      <button class="back" id="bk">Atrás</button>
      <button class="go" id="ok">Confirmar</button>
    </div>
    <button class="secundario hide" id="levantar">Levantar compañero</button>
    <button class="secundario" id="finronda">Fin de ronda del grupo</button>
  </div>
</div>

<div class="modal hide" id="modalSimbolo">
  <div class="modalCaja">
    <h1>Símbolo</h1>
    <p id="simboloTexto"></p>
    <button class="grande" id="simDano">+2 de daño</button>
    <button class="grande" id="simEmpujar">Empujar</button>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script src="/wake.js"></script>
<script src="/player.js"></script>
</body></html>
